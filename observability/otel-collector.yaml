receivers:
  otlp:
    protocols:
      grpc: {}
      http: {}
  prometheus:
    config:
      scrape_configs:
        - job_name: pulsecart
          kubernetes_sd_configs:
            - role: pod
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
  batch: {}
  k8sattributes: {}
exporters:
  debug: {}
  prometheus:
    endpoint: 0.0.0.0:8889
service:
  pipelines:
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, k8sattributes, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, batch]
      exporters: [debug]
