name: company-platform-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  service-build:
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, orders, worker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Lint Python service
        run: |
          python -m pip install --upgrade pip ruff
          ruff check services/${{ matrix.service }}

      - name: Build container
        run: docker build -t pulsecart-${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}

      - name: Scan image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: pulsecart-${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devops-${{ matrix.service }}
          docker tag pulsecart-${{ matrix.service }}:${GITHUB_SHA} ${IMAGE}:${GITHUB_SHA}
          docker push ${IMAGE}:${GITHUB_SHA}

  platform-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Render staging chart
        run: helm template gateway platform/helm/pulsecart-service -f environments/staging/gateway-values.yaml >/tmp/staging.yaml

      - name: Render production chart
        run: helm template gateway platform/helm/pulsecart-service -f environments/production/gateway-values.yaml >/tmp/production.yaml

      - name: Validate Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Validate shell scripts
        run: bash -n scripts/*.sh
