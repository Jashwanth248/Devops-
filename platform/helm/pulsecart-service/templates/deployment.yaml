apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app: {{ .Values.name }}}
  template:
    metadata:
      labels: {app: {{ .Values.name }}}
    spec:
      serviceAccountName: {{ .Values.name }}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{containerPort: {{ .Values.containerPort }}}]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          readinessProbe:
            httpGet: {path: /readyz, port: {{ .Values.containerPort }}}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: {{ .Values.containerPort }}}
            initialDelaySeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
