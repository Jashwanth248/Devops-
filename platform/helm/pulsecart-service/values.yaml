name: service
replicaCount: 2
image:
  repository: ghcr.io/jashwanth248/devops-
  tag: latest
  pullPolicy: IfNotPresent
containerPort: 8080
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 512Mi}
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65
